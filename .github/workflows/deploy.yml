name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  # Publishes scheduled blog articles (lib/blog-posts.ts): the daily run only builds and deploys
  # when an article in content/blog is dated today. 05:00 UTC is 06:00 or 07:00 in Paris.
  # Scheduled runs use the default branch.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Never run two deploys against the server at the same time.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  # Pushes and manual runs always deploy; the daily run only on a publication day.
  publication-check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4

      - name: Look for an article dated today
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Europe/Paris date +%F)
          if grep -lq "\"datePublished\": \"$today\"" content/blog/*/es.json; then
            echo "Article scheduled for $today: deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No article scheduled for $today: nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: publication-check
    if: needs.publication-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Only changed files are transferred, over a single connection.
      # --delete-after removes files the build no longer produces, once the new ones are in place.
      - name: Deploy to Hostinger via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          rsync -rlz --checksum --delete-after --stats \
            --chmod=D755,F644 \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./out/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
